<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adimensa — Seu acesso está sendo construído</title>
<link rel="icon" href="assets/favicon.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E4EAF1;
    --paper-2:#D3DCE7;
    --face:#F8FAFC;
    --ink:#0C2A4D;
    --ink-2:#3F5C7E;
    --blue:#1B6FC0;
    --cyan:#43B0F1;
    --rule:rgba(12,42,77,.14);
    --grid:rgba(27,111,192,.16);
    --display:"Archivo",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html,body{height:100%}

  body{
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(24px,4vh,44px);
    padding:clamp(24px,5vw,56px) clamp(18px,5vw,48px) clamp(84px,12vh,110px);
    background:var(--paper);
    color:var(--ink);
    font-family:var(--display);
    overflow:hidden;
    position:relative;
    -webkit-font-smoothing:antialiased;
  }

  /* ── camada de fundo: papel milimetrado que se move ao contrário ── */
  .backdrop{
    position:fixed;
    inset:-14%;
    z-index:0;
    pointer-events:none;
    background-image:
      linear-gradient(var(--grid) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid) 1px,transparent 1px),
      linear-gradient(rgba(27,111,192,.07) 1px,transparent 1px),
      linear-gradient(90deg,rgba(27,111,192,.07) 1px,transparent 1px);
    background-size:120px 120px,120px 120px,24px 24px,24px 24px;
    will-change:transform;
    transform:translate3d(0,0,0);
  }

  .vignette{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:radial-gradient(120% 90% at 50% 42%,rgba(255,255,255,.72) 0%,rgba(255,255,255,0) 48%,rgba(112,134,160,.30) 100%);
  }

  .dots{position:fixed;inset:0;z-index:2;pointer-events:none}
  .dot{
    position:absolute;
    border-radius:50%;
    background:var(--blue);
    will-change:transform;
  }

  /* ── conteúdo ── */
  .eyebrow{
    position:relative;z-index:3;
    font-family:var(--mono);
    font-size:clamp(10px,1.6vw,12px);
    letter-spacing:.34em;
    text-transform:uppercase;
    color:var(--ink-2);
    display:flex;align-items:center;gap:12px;
  }
  .pulse{
    width:7px;height:7px;border-radius:50%;
    background:var(--cyan);
    box-shadow:0 0 0 0 rgba(67,176,241,.7);
    animation:pulse 2.4s ease-out infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(67,176,241,.65)}
    70%{box-shadow:0 0 0 12px rgba(67,176,241,0)}
    100%{box-shadow:0 0 0 0 rgba(67,176,241,0)}
  }

  .stage{
    position:relative;z-index:3;
    perspective:1100px;
    perspective-origin:50% 50%;
    width:min(760px,88vw);
  }

  .card{
    position:relative;
    transform-style:preserve-3d;
    will-change:transform;
    transform:rotateX(0deg) rotateY(0deg);
  }

  .face{
    position:relative;
    aspect-ratio:1408/768;
    border-radius:4px;
    background:var(--face);
    border:1px solid rgba(12,42,77,.16);
    overflow:hidden;
    isolation:isolate;
    box-shadow:
      0 1px 0 rgba(255,255,255,.9) inset,
      0 26px 50px -28px rgba(12,42,77,.55),
      0 6px 14px -8px rgba(12,42,77,.30);
    transform:translateZ(38px);
  }

  .face img{
    display:block;width:100%;height:100%;object-fit:cover;
    mix-blend-mode:multiply;
  }

  .glare{
    position:absolute;inset:0;
    pointer-events:none;
    opacity:0;
    background:radial-gradient(46% 60% at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.85),rgba(255,255,255,0) 62%);
    transition:opacity .5s ease;
    mix-blend-mode:screen;
  }
  .edge{
    position:absolute;inset:0;
    pointer-events:none;
    border-radius:4px;
    box-shadow:0 0 0 1px rgba(67,176,241,0) inset;
    transition:box-shadow .45s ease;
  }
  .stage:hover .glare{opacity:1}
  .stage:hover .edge{box-shadow:0 0 0 1px rgba(67,176,241,.55) inset}

  /* cotas de desenho técnico */
  .dims{
    position:absolute;inset:-46px -34px -52px;
    pointer-events:none;
    transform:translateZ(14px);
    color:var(--blue);
  }
  .dims svg{width:100%;height:100%;overflow:visible}
  .dims .march{stroke-dasharray:7 6;animation:march 3.2s linear infinite}
  @keyframes march{to{stroke-dashoffset:-52}}
  .dims text{
    font-family:var(--mono);font-size:10px;letter-spacing:.22em;
    fill:var(--ink-2);text-transform:uppercase;
  }

  .copy{
    position:relative;z-index:3;
    text-align:center;
    max-width:min(720px,90vw);
    will-change:transform;
  }
  .wait{
    font-family:var(--mono);
    font-size:clamp(13px,2.4vw,16px);
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--ink-2);
    margin-bottom:14px;
  }
  .wait i{font-style:normal;animation:blink 1.6s steps(1) infinite}
  .wait i:nth-child(2){animation-delay:.4s}
  .wait i:nth-child(3){animation-delay:.8s}
  @keyframes blink{0%,50%{opacity:1}51%,100%{opacity:.18}}

  h1{
    font-size:clamp(24px,4.6vw,44px);
    font-weight:800;
    line-height:1.1;
    letter-spacing:-.02em;
    text-wrap:balance;
  }
  h1 span{color:var(--blue)}

  footer{
    position:fixed;
    left:0;right:0;bottom:0;
    z-index:4;
    padding:16px clamp(18px,5vw,40px);
    border-top:1px solid var(--rule);
    background:linear-gradient(to top,rgba(228,234,241,.96),rgba(228,234,241,.72));
    backdrop-filter:blur(6px);
    font-family:var(--mono);
    font-size:clamp(10px,1.7vw,12.5px);
    letter-spacing:.06em;
    color:var(--ink-2);
    text-align:center;
  }
  footer b{color:var(--ink);font-weight:500}
  footer .sep{color:var(--cyan);padding:0 .55em}

  @media (max-width:640px){
    .dims{inset:-32px -20px -38px}
    .dims text{font-size:8px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>

<script>
(function(){
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var stage   = document.getElementById('stage');
  var card    = document.getElementById('card');
  var glare   = document.getElementById('glare');
  var backdrop= document.getElementById('backdrop');
  var copy    = document.getElementById('copy');
  var dotsBox = document.getElementById('dots');

  /* nuvem de pontos com profundidades diferentes (ecoa o logo) */
  var dots = [];
  if(!reduce){
    for(var i=0;i<16;i++){
      var d = document.createElement('span');
      d.className = 'dot';
      var s = 3 + Math.random()*7;
      d.style.width = d.style.height = s.toFixed(1)+'px';
      d.style.left = (Math.random()*100).toFixed(2)+'%';
      d.style.top  = (Math.random()*100).toFixed(2)+'%';
      d.style.opacity = (0.10 + Math.random()*0.30).toFixed(2);
      dotsBox.appendChild(d);
      dots.push({el:d, depth: 10 + Math.random()*70});
    }
  }

  var tx=0, ty=0, cx=0, cy=0;   /* alvo e valor corrente (-1 a 1) */
  var active = false, idle = 0;

  function setTarget(px, py){
    var r = stage.getBoundingClientRect();
    tx = (px - (r.left + r.width/2)) / (r.width/2);
    ty = (py - (r.top  + r.height/2)) / (r.height/2);
    tx = Math.max(-1.6, Math.min(1.6, tx));
    ty = Math.max(-1.6, Math.min(1.6, ty));
    glare.style.setProperty('--gx', (50 + tx*38).toFixed(1)+'%');
    glare.style.setProperty('--gy', (50 + ty*38).toFixed(1)+'%');
  }

  window.addEventListener('mousemove', function(e){ active = true; setTarget(e.clientX, e.clientY); }, {passive:true});
  window.addEventListener('mouseleave', function(){ active = false; tx = ty = 0; });
  stage.addEventListener('touchmove', function(e){
    var t = e.touches[0];
    active = true; setTarget(t.clientX, t.clientY);
    e.preventDefault();
  }, {passive:false});
  stage.addEventListener('touchend', function(){ active = false; tx = ty = 0; });

  window.addEventListener('deviceorientation', function(e){
    if(active || e.gamma == null) return;
    tx = Math.max(-1, Math.min(1, e.gamma/28));
    ty = Math.max(-1, Math.min(1, (e.beta-45)/28));
  });

  function frame(t){
    if(!active){                       /* respiração lenta quando parado */
      idle = t/1000;
      tx = Math.sin(idle*0.42)*0.16;
      ty = Math.cos(idle*0.33)*0.11;
    }
    cx += (tx - cx)*0.085;
    cy += (ty - cy)*0.085;

    card.style.transform =
      'rotateX(' + (-cy*9).toFixed(2) + 'deg) rotateY(' + (cx*12).toFixed(2) + 'deg)';
    backdrop.style.transform =
      'translate3d(' + (-cx*30).toFixed(1) + 'px,' + (-cy*22).toFixed(1) + 'px,0) scale(1.03)';
    copy.style.transform =
      'translate3d(' + (cx*10).toFixed(1) + 'px,' + (cy*7).toFixed(1) + 'px,0)';

    for(var i=0;i<dots.length;i++){
      var d = dots[i];
      d.el.style.transform =
        'translate3d(' + (cx*d.depth).toFixed(1) + 'px,' + (cy*d.depth*0.7).toFixed(1) + 'px,0)';
    }
    requestAnimationFrame(frame);
  }

  if(!reduce) requestAnimationFrame(frame);
})();
</script>
